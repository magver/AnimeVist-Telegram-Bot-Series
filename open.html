<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080b11">
  <title>AnimeVist — Переход к серии</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #080b11;
      --bg-surface: rgba(15, 23, 42, 0.85);
      --bg-card: rgba(18, 26, 47, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.5);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #00e5ff;
      --accent-magenta: #ec4899;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(99, 102, 241, 0.25), transparent 60%),
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.12), transparent 45%),
        radial-gradient(circle at 15% 70%, rgba(0, 229, 255, 0.10), transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 2rem 1.75rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-magenta), transparent);
    }

    .logo-wrap {
      position: relative;
      width: 84px;
      height: 84px;
      margin: 0 auto 1.25rem;
    }

    .logo-halo {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.35) 0%, rgba(236, 72, 153, 0.25) 50%, transparent 70%);
      filter: blur(14px);
      border-radius: 50%;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6));
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .meta-box {
      background: rgba(11, 17, 32, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 0.5rem;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .meta-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      margin-bottom: 0.65rem;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .fallback-box {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .fallback-box a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .fallback-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-wrap">
      <div class="logo-halo"></div>
      <img src="assets/logo.png" alt="AnimeVist" class="logo-img" onerror="this.src='https://raw.githubusercontent.com/magver/AnimeVist-Telegram-Bot/main/assets/logo.png'">
    </div>

    <div class="badge-status" id="statusBadge">
      <span class="spinner" id="spinner"></span>
      <span id="statusText">Запуск приложения...</span>
    </div>

    <h1 id="pageTitle">Смотреть в AnimeVist</h1>
    <p class="subtitle" id="pageSubtitle">Открываем запрошенную серию в максимальном качестве без рекламы</p>

    <div class="meta-box" id="metaBox">
      <div class="meta-item">
        <span class="meta-label">ID Тайтла</span>
        <span class="meta-val" id="metaAnimeId">—</span>
      </div>
      <div class="meta-item" style="border-left: 1px solid var(--border-subtle); height: 28px;"></div>
      <div class="meta-item">
        <span class="meta-label">Серия</span>
        <span class="meta-val" id="metaEpisode">—</span>
      </div>
    </div>

    <a href="#" id="btnOpenApp" class="btn btn-primary" onclick="triggerDeepLink()">
      ▶️ Открыть серию в AnimeVist
    </a>

    <a href="https://github.com/magver/AnimeVist-Releases/releases/latest" id="btnDownload" class="btn btn-secondary" target="_blank">
      📥 Скачать приложение AnimeVist
    </a>

    <div class="fallback-box">
      Не открылось автоматически? <a href="#" id="linkDirectProtocol">Открыть по прямой ссылке</a> или <a href="https://t.me/animevist_chat" target="_blank">написать в чат поддержки</a>.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawAnimeId = (params.get('animeId') || params.get('animeid') || params.get('id') || params.get('vostId') || params.get('vostid') || '').trim();
    const episode = (params.get('episode') || params.get('ep') || params.get('series') || '1').trim();

    // The installed AnimeVist application resolver requires AnimeVost IDs to be prefixed with 'vost-'
    // (e.g., 'vost-3950'). If passed as pure numeric '3950', we ensure the 'vost-' prefix is present.
    const numericId = rawAnimeId.replace(/^vost-/, '');
    const vostKey = numericId ? `vost-${numericId}` : rawAnimeId;

    document.getElementById('metaAnimeId').textContent = numericId ? `#${numericId}` : (vostKey || 'Аниме');
    document.getElementById('metaEpisode').textContent = `${episode} серия`;

    // Multi-parameter format supporting every version of AnimeVist (class N3 router, App.tsx, legacy)
    const queryParams = `animeId=${encodeURIComponent(vostKey)}&id=${encodeURIComponent(vostKey)}&vostId=${encodeURIComponent(numericId)}&episode=${encodeURIComponent(episode)}&ep=${encodeURIComponent(episode)}&series=${encodeURIComponent(episode)}`;
    const deepLinkUrl = `animevist://watch?${queryParams}`;
    const intentUrl = `intent://watch?${queryParams}#Intent;scheme=animevist;package=com.animevist.app;S.browser_fallback_url=${encodeURIComponent(window.location.href)};end`;

    const isAndroid = /Android/i.test(navigator.userAgent);
    const targetUrl = isAndroid ? intentUrl : deepLinkUrl;

    const btnOpenApp = document.getElementById('btnOpenApp');
    if (btnOpenApp) {
      btnOpenApp.href = targetUrl;
    }

    const linkDirect = document.getElementById('linkDirectProtocol');
    if (linkDirect) {
      linkDirect.href = deepLinkUrl;
    }

    function triggerDeepLink() {
      if (isAndroid) {
        window.location.href = intentUrl;
      } else {
        window.location.href = deepLinkUrl;
      }
    }

    if (vostKey) {
      setTimeout(triggerDeepLink, 150);

      setTimeout(() => {
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('statusText');
        if (spinner) spinner.style.display = 'none';
        if (statusText) statusText.textContent = 'Ожидание запуска';
      }, 2500);
    } else {
      document.getElementById('statusText').textContent = 'Выберите аниме';
      const spinner = document.getElementById('spinner');
      if (spinner) spinner.style.display = 'none';
    }
  </script>
</body>
</html>
